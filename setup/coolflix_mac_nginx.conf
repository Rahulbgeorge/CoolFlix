worker_processes 1;
daemon off;
pid {{PROJECT_DIR}}/setup/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    # Explicit inline mime types for zero-dependency portability
    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        image/gif gif;
        image/jpeg jpeg jpg;
        application/javascript js;
        text/plain txt;
        image/png png;
        image/x-icon ico;
        image/svg+xml svg svgz;
        video/mp4 mp4;
        video/mpeg mpeg mpg;
        video/quicktime mov;
        video/webm webm;
        application/x-mpegURL m3u8;
        video/MP2T ts;
    }

    client_max_body_size 10G;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    access_log {{PROJECT_DIR}}/setup/nginx_access.log;
    error_log {{PROJECT_DIR}}/setup/nginx_error.log info;

    server {
        listen 8000;
        server_name localhost;

        # Frontend React SPA assets and routing
        location / {
            root {{PROJECT_DIR}}/backend/media/frontend;
            try_files $uri $uri/ /index.html;
        }

        # Frontend React SPA assets direct access
        location /media/frontend/ {
            alias {{PROJECT_DIR}}/backend/media/frontend/;
            add_header Access-Control-Allow-Origin *;
            access_log off;
        }

        # Media files (HLS, thumbnails, sprites, video streams)
        # On macOS dev, this points to ~/Downloads where media is stored
        location /media/ {
            alias /Users/rahulbg/Downloads/;

            # High-performance I/O
            sendfile on;
            tcp_nopush on;

            # MP4 pseudo-streaming (enables seeking via byte-range)
            mp4;
            mp4_buffer_size 1m;
            mp4_max_buffer_size 5m;

            # Range request support for video seeking
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            access_log off;
        }

        # X-Accel-Redirect support (for Django-initiated file sends)
        location /original_videos/ {
            internal;
            alias /;
        }

        # API & Admin Reverse Proxy to Django
        location ~ ^/(api|admin) {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
