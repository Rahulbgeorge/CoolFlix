worker_processes 1;
daemon off;
pid /home/eleven/projects/CoolFlix/setup/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    # Explicit inline mime types for zero-dependency portability
    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        image/gif gif;
        image/jpeg jpeg jpg;
        application/javascript js;
        text/plain txt;
        image/png png;
        image/x-icon ico;
        image/svg+xml svg svgz;
        video/mp4 mp4;
        video/mpeg mpeg mpg;
        video/quicktime mov;
        video/webm webm;
        application/x-mpegURL m3u8;
        video/MP2T ts;
    }

    client_max_body_size 10G;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    access_log /home/eleven/projects/CoolFlix/setup/nginx_access.log;
    error_log /home/eleven/projects/CoolFlix/setup/nginx_error.log info;

    server {
        listen 8000;
        server_name localhost;

        # Frontend React SPA assets and routing
        location / {
            root /home/eleven/projects/CoolFlix/backend/media/frontend;
            try_files $uri $uri/ /index.html;
        }

        # Media directory direct access (for HLS chunks, sprites, thumbnails)
        location /media/ {
            alias /home/eleven/projects/CoolFlix/backend/media/;
            add_header Access-Control-Allow-Origin *;
            access_log off;
        }

        # Protected internal location for serving original video files via X-Accel-Redirect
        location /original_videos/ {
            internal;
            alias /; # Maps to root of the filesystem to serve absolute paths
        }

        # API & Admin Reverse Proxy to Django
        location ~ ^/(api|admin) {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support long connections for large range downloads
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
