server {
    listen 8000;
    server_name _;

    client_max_body_size 10G;

    # React frontend
    root /home/eleven/projects/CoolFlix/backend/media/frontend;
    index index.html;

    # Django API/Admin
    location ~ ^/(api|admin) {
        proxy_pass http://127.0.0.1:8001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Frontend assets
    location /media/frontend/ {
        alias /home/eleven/projects/CoolFlix/backend/media/frontend/;
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # Media files (HLS, thumbnails, sprites, video streams)
    location /media/ {
        alias /home/eleven/movies/;

        # High-performance I/O
        sendfile on;
        tcp_nopush on;
        aio threads;

        # MP4 pseudo-streaming (enables seeking via byte-range)
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;

        # Range request support for video seeking
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # X-Accel-Redirect support (for Django-initiated file sends)
    location /original_videos/ {
        internal;
        alias /;
    }
}