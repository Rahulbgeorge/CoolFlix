# System Nginx site configuration for CoolFlix
# Save this file to: /etc/nginx/sites-enabled/coolflix

server {
    listen 8000;
    server_name localhost;

    client_max_body_size 10G;

    # Frontend React SPA assets and routing
    location / {
        root {{PROJECT_DIR}}/backend/media/frontend;
        try_files $uri $uri/ /index.html;
    }

    # Frontend React SPA assets direct access
    location /media/frontend/ {
        alias {{PROJECT_DIR}}/backend/media/frontend/;
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # Media directory direct access (for HLS chunks, sprites, thumbnails)
    location /media/ {
        alias {{PROJECT_DIR}}/backend/media/;
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # Protected internal location for serving original video files via X-Accel-Redirect
    location /original_videos/ {
        internal;
        alias /; # Maps to root of the filesystem to serve absolute paths
    }

    # API & Admin Reverse Proxy to Django
    location ~ ^/(api|admin) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support long connections for large range downloads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
